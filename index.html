<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sybix Secure - Slide 2 (Final Fix)</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Syncopate:wght@700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --dark-navy: #0b1325;
            --teal: #1a5e78;
            --bright-cyan: #38a4b8;
            --light-aqua: #66e3e7;
            --white: #ffffff;
            --off-white: #e0e6ed;
            --font-wide: 'Syncopate', sans-serif;
            --font-adriana: 'Playfair Display', serif;
            --font-body: 'Lato', sans-serif;
        }

        * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        
        body {
            background-color: #111822;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .preview-scale {
            transform: scale(0.6); 
            transform-origin: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1080x1350 - Alignment matched to Slide 1 */
        .poster {
            width: 1080px;
            height: 1350px;
            background: linear-gradient(150deg, #0d2136 0%, var(--teal) 100%);
            padding: 80px 90px; /* Standardized padding */
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Logo - Locked at 450px */
        .logo {
            width: 450px; 
            height: auto;
            align-self: center;
            margin-bottom: 50px; /* Slightly tightened to save room */
        }

        .eyebrow {
            font-family: var(--font-wide);
            font-size: 1.5rem;
            color: var(--light-aqua);
            letter-spacing: 5px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .heading-adriana {
            font-family: var(--font-adriana);
            font-size: 5.2rem; /* Adjusted slightly for better fit */
            line-height: 1.1;
            color: var(--white);
            margin: 0 0 45px 0;
            font-weight: 500;
        }

        /* Service List - Point 3 is now fully visible */
        .service-list {
            display: flex;
            flex-direction: column;
            gap: 30px; /* Balanced gap */
        }

        .service-item {
            border-left: 6px solid var(--bright-cyan);
            padding-left: 30px;
        }

        .service-title {
            font-family: var(--font-wide);
            font-size: 1.6rem;
            color: var(--light-aqua);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .service-desc {
            font-family: var(--font-body);
            font-size: 1.85rem; 
            color: var(--off-white);
            line-height: 1.45;
            font-weight: 300;
        }

        /* Footer - Matches Slide 1 exactly */
        .footer-action {
            margin-top: auto; 
            font-family: var(--font-wide);
            font-size: 1.8rem; 
            color: var(--bright-cyan);
            letter-spacing: 3px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 3px solid rgba(255,255,255,0.1);
            padding-top: 35px;
            padding-bottom: 10px;
        }

        .arrow { font-size: 3rem; }

        @media print {
            body { background: white; overflow: visible; }
            .preview-scale { transform: none; width: 1080px; height: 1350px; }
            .poster { box-shadow: none; border: none; }
        }
    </style>
</head>
<body>

    <div class="preview-scale">
        <div class="poster" id="slide2">
            <div class="content">
                
                <img src="https://i.postimg.cc/vm6bwXqR/IMG-9698.png" alt="Sybix Secure" class="logo">
                
                <div class="eyebrow">How we help</div>
                
                <h1 class="heading-adriana">Reclaiming your <br>digital peace.</h1>
                
                <div class="service-list">
                    <!-- Point 1 -->
                    <div class="service-item">
                        <div class="service-title">Getting you back in</div>
                        <div class="service-desc">Losing access to your accounts is incredibly stressful. We help you navigate the recovery process and reclaim your identity.</div>
                    </div>

                    <!-- Point 2 -->
