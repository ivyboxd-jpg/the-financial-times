<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sybix - Slide 2 (Visual Dashboard)</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Syncopate:wght@700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --dark-navy: #0b1325; --bright-cyan: #38a4b8; --light-aqua: #66e3e7; 
            --white: #ffffff; --light-grey: #e2e8f0; 
            --font-wide: 'Syncopate', sans-serif; --font-adriana: 'Playfair Display', serif; --font-body: 'Lato', sans-serif; 
        }
        * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        body { background-color: #050a12; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .preview-scale { transform: scale(0.6); transform-origin: center; }
        
        .poster {
            width: 1080px; height: 1350px; background-color: var(--dark-navy);
            padding: 80px 90px; display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        /* Tech Visual Background (Matches Slide 1) */
        .poster::before {
            content: ""; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(56, 164, 184, 0.08) 1px, transparent 1px);
            background-size: 50px 50px; z-index: 0;
        }
        
        /* Decorative Background Glow */
        .glow-sphere { 
            position: absolute; bottom: -10%; right: -5%; width: 800px; height: 800px; 
            background: radial-gradient(circle, rgba(26, 94, 120, 0.25) 0%, transparent 70%); 
            z-index: 1; 
        }

        .content { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }
        
        .logo { width: 410px; align-self: center; margin-bottom: 50px; }
        
        .eyebrow { 
            font-family: var(--font-wide); font-size: 1.4rem; color: var(--light-aqua); 
            letter-spacing: 6px; margin-bottom: 25px; text-transform: uppercase; 
        }
        
        .heading-adriana { 
            font-family: var(--font-adriana); font-size: 4.8rem; line-height: 1.1; 
            color: var(--white); margin: 0 0 55px 0; font-weight: 500; 
        }
        
        /* VISUAL CARDS */
        .service-list { display: flex; flex-direction: column; gap: 30px; }

        .service-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 6px solid var(--bright-cyan);
            padding: 40px;
            border-radius: 0 20px 20px 0;
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        /* Subtle inner glow for card */
        .service-card::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, rgba(56, 164, 184, 0.05) 0%, transparent 100%);
            pointer-events: none;
        }

        .card-number {
            font-family: var(--font-wide);
            font-size: 1.2rem;
            color: rgba(102, 227, 231, 0.3);
            margin-right: 40px;
            transform: rotate(-90deg);
        }

        .card-content { flex: 1; }

        .service-title {
            font-family: var(--font-wide);
            font-size: 1.6rem;
            color: var(--light-aqua);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .service-desc {
            font-family: var(--font-body);
            font-size: 2.1rem;
            color: var(--light-grey);
            font-weight: 300;
            line-height: 1.4;
        }

    </style>
</head>
<body>
    <div class="preview-scale">
        <div class="poster">
            <div class="glow-sphere"></div>
            <div class="content">
                
                <!-- Matching Logo -->
                <img src="https://i.postimg.cc/vm6bwXqR/IMG-9698.png" class="logo">
                
                <div class="eyebrow">How we help</div>
                <h1 class="heading-adriana">Reclaiming your <br>digital peace.</h1>
                
                <div class="service-list">
                    
                    <!-- Visual Card 1 -->
                    <div class="service-card">
                        <div class="card-number">01</div>
                        <div class="card-content">
                            <div class="service-title">Getting you back in</div>
                            <div class="service-desc">Reclaiming your accounts and identity.</div>
                        </div>
                    </div>

                    <!-- Visual Card 2 -->
                    <div class="service-card">
                        <div class="card-number">02</div>
                        <div class="card-content">
                            <div class="service-title">Cleaning the noise</div>
                            <div class="service-desc">Identifying and helping reduce hidden risks.</div>
                        </div
