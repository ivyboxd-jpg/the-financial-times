<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VerifiedWork Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 1080px;
        height: 1080px;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #FFFFFF;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .poster {
        width: 1080px;
        height: 1080px;
        background-color: #FFFFFF;
        padding: 64px 72px 40px 72px;
        position: relative;
        display: flex;
        flex-direction: column;
    }

    .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 936px;
    }

    .nav-left {
        display: flex;
        align-items: center;
    }

    .nav-logo-icon {
        height: 48px; /* Perfect size—visible but not too big */
        width: auto;
        max-width: 200px;
        object-fit: contain;
        display: block;
    }

    .nav-right {
        background-color: #D8F3DC;
        border-radius: 999px;
        padding: 8px 18px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .nav-right-dot {
        width: 7px;
        height: 7px;
        background-color: #2D6A4F;
        border-radius: 4px;
    }

    .nav-right-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 12px;
        color: #1F4A37;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        line-height: 12px;
    }

    .headline {
        width: 936px;
        margin-top: 100px;
        margin-bottom: 28px;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 108px;
        line-height: 108px;
        letter-spacing: -4px;
        color: #1A1A1A;
    }

    .headline span {
        color: #2D6A4F;
    }

    .subline {
        width: 936px;
        margin-bottom: 48px;
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 22px;
        line-height: 35px; /* 1.6 */
        color: #6B7280;
    }

    .stat-card {
        width: 936px;
        background-color: #EBEBEB;
        border-radius: 20px;
        padding: 32px 40px;
        display: flex;
        align-items: center;
        gap: 32px;
        margin-bottom: 48px;
    }

    .stat-card-left {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 80px;
        color: #2D6A4F;
        letter-spacing: -3px;
        line-height: 80px;
    }

    .stat-card-right {
        display: flex;
        flex-direction: column;
    }

    .stat-card-right-top {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 18px;
        color: #1A1A1A;
        line-height: 27px; /* 1.5 */
        margin-bottom: 8px;
    }

    .stat-card-right-bottom {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 400;
        font-size: 12px;
        color: #9CA3AF;
        line-height: 12px;
    }

    .divider {
        width: 936px;
        height: 1px;
        background-color: #F3F4F6;
        margin-bottom: 28px;
    }

    .footer {
        width: 936px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto; /* Ensures the footer sits perfectly at the bottom */
    }

    .footer-cta {
        background-color: #1A1A1A;
        border-radius: 999px;
        padding: 14px 28px;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 18px;
        color: #FFFFFF;
        line-height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .footer-url {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 400;
        font-size: 14px;
        color: #9CA3AF;
        line-height: 14px;
    }
</style>
</head>
<body>
    <div class="poster">
        <div class="nav">
            <div class="nav-left">
                <!-- PASTE YOUR IMAGE URL IN THE SRC BELOW -->
                <img class="nav-logo-icon" src="https://i.postimg.cc/SsQnGfmg/logo-white.png" alt="Logo">
            </div>
            <div class="nav-right">
                <div class="nav-right-dot"></div>
                <div class="nav-right-text">PRIVATE BETA · WAITLIST OPEN</div>
            </div>
        </div>

        <div class="headline">
            You did<br>
            the <span>work.</span><br>
            Now prove it.
        </div>
