<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sybix - Slide 2 (Text Fixed)</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Syncopate:wght@700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --dark-navy: #0b1325; 
            --bright-cyan: #38a4b8; 
            --light-aqua: #66e3e7; 
            --white: #ffffff; 
            --light-grey: #e2e8f0; 
            --font-wide: 'Syncopate', sans-serif; 
            --font-adriana: 'Playfair Display', serif; 
            --font-body: 'Lato', sans-serif; 
        }

        * { box-sizing: border-box; }
        
        body { 
            background-color: #050a12; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .preview-scale { transform: scale(0.6); transform-origin: center; }
        
        .poster {
            width: 1080px; 
            height: 1350px; 
            background-color: var(--dark-navy);
            padding: 90px; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        /* Simplified Background visual - No banding, No interference with text */
        .poster::before {
            content: ""; position: absolute; top: 0; right: 0; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(26, 94, 120, 0.3) 0%, transparent 70%);
        }

        .logo { 
            width: 410px; 
            height: auto; 
            align-self: center; 
            margin-bottom: 50px; 
            position: relative;
        }
        
        .eyebrow { 
            font-family: var(--font-wide); 
            font-size: 1.5rem; 
            color: var(--light-aqua); 
            letter-spacing: 6px; 
            margin-bottom: 30px; 
            text-transform: uppercase;
            position: relative;
        }
        
        .heading-adriana { 
            font-family: var(--font-adriana); 
            font-size: 5.5rem; 
            line-height: 1.1; 
            color: var(--white); 
            margin: 0 0 60px 0; 
            font-weight: 500;
            position: relative;
        }
        
        .service-list { 
            display: flex; 
            flex-direction: column; 
            gap: 30px; 
            position: relative;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.05); /* Slight lift
