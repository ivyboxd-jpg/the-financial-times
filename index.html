<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerifiedWork LinkedIn Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-navy: #1B2B4B;
            --accent-blue: #4A90D9;
            --white: #FFFFFF;
            --black: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* BANNER CONTAINER */
        .banner {
            width: 1584px;
            height: 396px;
            background-color: var(--white);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 100px;
            position: relative;
            overflow: hidden;
            border: 1px solid #ddd; /* Visual border for the file preview */
        }

        /* LOGO RECONSTRUCTION */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-verified {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 64px;
            color: var(--black);
            letter-spacing: -2px;
        }

        .logo-check {
            width: 48px;
            height: 48px;
            background-color: #2da44e; /* Keeping the green from the original logo for authenticity */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            top: 4px;
        }

        .logo-check::after {
            content: '';
            width: 12px;
            height: 24px;
            border: solid white;
            border-width: 0 5px 5px 0;
            transform: rotate(45deg);
            margin-bottom: 5px;
        }

        .logo-work {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 700;
            font-size: 72px;
            color: var(--black);
            margin-left: 5px;
        }

        /* SLOGAN SIDE */
        .slogan-container {
            text-align: right;
            border-right: 8px solid var(--accent-blue);
            padding-right: 30px;
        }

        .slogan-text {
            font-family: 'Inter', sans-serif;
            font-size: 42px;
            color: var(--primary-navy);
            line-height: 1.2;
        }

        .slogan-text span {
            font-weight: 800;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .slogan-text em {
            font-style: normal;
            font-weight: 400;
            color: #555;
        }

        /* DECORATIVE ELEMENTS (Minimalist Blue Accents) */
        .accent-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--primary-navy) 70%, var(--accent-blue) 100%);
        }
    </style>
</head>
<body>

    <div class="banner">
        <!-- Logo Left -->
        <div class="logo-container">
            <span class="logo-verified">verified</span>
            <div class="logo-check"></div>
            <span class="logo-work">work</span>
        </div>

        <!-- Slogan Right -->
        <div class="slogan-container">
            <div class="slogan-text">
                <span>Human validation</span>
                <em>in an AI world.</em>
            </div>
        </div>

        <!-- Bottom Accent -->
        <div class="accent-bar"></div>
    </div>

</body>
</html>
