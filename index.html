<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerifiedWork LinkedIn Banner</title>
    <!-- Importing fonts to match the image exactly -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1B2B4B;
            --blue-accent: #4A90D9;
            --white: #FFFFFF;
            --logo-black: #000000;
            --check-green: #24a17b;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        /* EXACT LINKEDIN DIMENSIONS */
        .banner {
            width: 1584px;
            height: 396px;
            background-color: var(--white);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 100px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* --- LOGO SECTION --- */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .verified-text {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 82px;
            color: var(--logo-black);
            letter-spacing: -3px;
        }

        /* The green dot with checkmark */
        .dot-icon {
            width: 54px;
            height: 54px;
            background-color: var(--check-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            position: relative;
            top: 5px;
        }

        .dot-icon::after {
            content: '';
            width: 12px;
            height: 24px;
            border: solid white;
            border-width: 0 6px 6px 0;
            transform: rotate(45deg);
            margin-bottom: 6px;
        }

        .work-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 900;
            font-size: 96px;
            color: var(--logo-black);
            letter-spacing: -1px;
        }

        /* --- SLOGAN SECTION --- */
        .slogan-container {
            max-width: 600px;
            text-align: right;
        }

        .slogan-text {
            font-family: 'Inter', sans-serif;
            font-size: 42px;
            line-height: 1.1;
            color: var(--navy);
            font-weight: 900;
            text-transform: uppercase;
        }

        .slogan-text span {
            color: var(--blue-accent);
            display: block;
            font-size: 38px;
            font-weight: 400;
            text-transform: none;
            margin-top: 5px;
        }

        /* Subtle professional accents */
        .bottom-border {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, var(--navy) 0%, var(--blue-accent) 100%);
        }

    </style>
</head>
<body>

    <div class="banner">
        <!-- Logo Recreated from Image -->
        <div class="logo-container">
            <div class="verified-text">verified</div>
            <div class="dot-icon"></div>
            <div class="work-text">work</div>
        </div>

        <!-- Professional Typography Slogan -->
        <div class="slogan-container">
            <div class="slogan-text">
                Human validation
                <span>in an AI world.</span>
            </div>
        </div>

        <!-- Decorative UI Element -->
        <div class="bottom-border"></div>
    </div>

</body>
</html>
