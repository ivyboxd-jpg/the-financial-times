<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sybix Secure - Slide 2 Final</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Syncopate:wght@700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --dark-navy: #0b1325;
            --teal: #1a5e78;
            --bright-cyan: #38a4b8;
            --light-aqua: #66e3e7;
            --white: #ffffff;
            --off-white: #e0e6ed;
            --font-wide: 'Syncopate', sans-serif;
            --font-adriana: 'Playfair Display', serif;
            --font-body: 'Lato', sans-serif;
        }

        * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        
        body {
            background-color: #111822;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .preview-scale {
            transform: scale(0.6); 
            transform-origin: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* LOCKED 1080x1350 */
        .poster {
            width: 1080px;
            height: 1350px;
            background: linear-gradient(150deg, #0d2136 0%, var(--teal) 100%);
            padding: 60px 90px; 
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Logo - Locked at 450px */
        .logo {
            width: 450px; 
            height: auto;
            align-self: center;
            margin-bottom: 30px;
        }

        .eyebrow {
            font-family: var(--font-wide);
            font-size: 1.4rem;
            color: var(--light-aqua);
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .heading-adriana {
            font-family: var(--font-adriana);
            font-size: 4.5rem;
            line-height: 1.1;
            color: var(--white);
            margin: 0 0 40px 0;
            font-weight: 500;
        }

        /* Service List */
        .service-list {
            display: flex;
            flex-direction: column;
            gap: 25px; 
        }

        .service-item {
            border-left: 6px solid var(--bright-cyan);
            padding-left: 30px;
        }

        .service-title {
            font-family: var(--font-wide);
            font-size: 1.5rem;
            color: var(--light-aqua);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .service-desc {
            font-family: var(--font-body);
            font-size: 1.75rem;
            color: var(--off-white);
            line-height: 1.4;
            font-weight: 300;
        }

            body { background: white; overflow: visible; }
