<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VerifiedWork Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 1080px;
        min-height: 1080px; 
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto; 
        background-color: #FFFFFF;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .poster {
        width: 1080px;
        height: 1080px;
        padding: 64px 72px 40px 72px;
        background-color: #FFFFFF;
        display: flex;
        flex-direction: column;
    }

    .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 936px;
        height: 64px; /* Increased to fit the larger logo */
        margin-bottom: 40px; /* Reduced from 56px to perfectly compensate. Total space is still exactly 104px, so nothing below shifts */
    }

    .nav-left {
        display: flex;
        align-items: center;
    }

    .nav-logo-icon {
        height: 64px; /* Increased to make it properly visible but not too big */
        width: auto;
        display: block;
        border-radius: 6px;
    }

    .headline {
        width: 936px;
        margin-bottom: 28px;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 108px;
        line-height: 108px;
        letter-spacing: -4px;
        color: #1A1A1A;
    }

    .headline-line {
        height: 108px;
    }

    .headline-green {
        color: #2D6A4F;
    }

    .subline {
        width: 936px;
        margin-bottom: 48px;
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 22px;
        line-height: 35px;
        color: #6B7280;
    }

    .subline-line {
        height: 35px;
    }

    .stat-card {
        width: 936px;
        background-color: #EBEBEB;
        border-radius: 20px;
        padding: 32px 40px;
        display: flex;
        align-items: center;
        gap: 32px;
        margin-bottom: 48px;
    }

    .stat-card-left {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 80px;
        line-height: 80px;
        letter-spacing: -3px;
        color: #2D6A4F;
    }

    .stat-card-right {
        display: flex;
        flex-direction: column;
    }

    .stat-card-right-top {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 18px;
        line-height: 27px;
        color: #1A1A1A;
        margin-bottom: 8px;
    }

    .stat-card-right-bottom {
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 12px;
        line-height: 12px;
        color: #9CA3AF;
    }

    .divider {
        width: 936px;
        height: 1px;
        background-color: #F3F4F6;
        margin-bottom: 28px;
    }

    .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 936px;
        height: 50px;
    }

    .footer-cta {
        background-color: #1A1A1A;
        border-radius: 999px;
        padding: 14px 28px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 18px;
        line-height: 18px;
        color: #FFFFFF;
    }

    .footer-url {
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 14px;
        line-height: 14px;
        color: #9CA3AF;
    }
</style>
</head>
<body>
    <div class="poster">
        <div class="nav">
            <div class="nav-left">
                <!-- Icon Placeholder Link -->
                <a href="https://verifiedwork.co">
                    <img class="nav-logo-icon" src="https://i.postimg.cc/hvb5rRgM/0615707E-93DD-4BC6-902B-CDE330CD398C.jpg" alt="Icon Placeholder">
                </a>
            </div>
        </div>

        <div class="headline">
            <div class="headline-line">You did</div>
            <div class="headline-line">the <span class="headline-green">work.</span></div>
            <div class="headline-line">Now prove it.</div>
        </div>

        <div class="subline">
            <div class="subline-line">Human validation in an AI world.</div>
            <div class="subline-line">Verified by people who were actually there.</div>
        </div>

        <div class="stat-card">
            <div class="stat-card-left">7×</div>
            <div class="stat-card-right">
                <div class="stat-card-right-top">Referred candidates are 7× more likely to get hired than job-board applicants.</div>
                <div class="stat-card-right-bottom">— Pinpoint, 4.5M applications, 2023</div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="footer">
            <div class="footer-cta">Join the Waitlist &rarr;</div>
            <!-- verifiedwork.co is safely right here -->
            <div class="footer-url">verifiedwork.co</div>
        </div>
    </div>
</body>
</html>
