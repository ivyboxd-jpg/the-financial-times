<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sybix - Slide 2 (Punchy)</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Syncopate:wght@700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        :root { --dark-navy: #0b1325; --bright-cyan: #38a4b8; --light-aqua: #66e3e7; --white: #ffffff; --off-white: #e0e6ed; --font-wide: 'Syncopate', sans-serif; --font-adriana: 'Playfair Display', serif; --font-body: 'Lato', sans-serif; }
        * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        body { background-color: #111822; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .preview-scale { transform: scale(0.6); transform-origin: center; display: flex; justify-content: center; align-items: center; }
        .poster {
            width: 1080px; height: 1350px;
            background: linear-gradient(150deg, var(--dark-navy) 0%, #0d2136 100%);
            padding: 100px; display: flex; flex-direction: column; position: relative;
        }
        .logo { width: 450px; align-self: center; margin-bottom: 60px; }
        .eyebrow { font-family: var(--font-wide); font-size: 1.5rem; color: var(--light-aqua); letter-spacing: 6px; margin-bottom: 30px; text-transform: uppercase; }
        .heading-adriana { font-family: var(--font-adriana); font-size: 5.5rem; line-height: 1.1; color: var(--white); margin: 0 0 60px 0; font-weight: 500; }
        .service-list { display: flex; flex-direction: column; gap: 40px; }
        .service-item { border-left: 6px solid var(--bright-cyan); padding-left: 30px; }
        .service-title { font-family: var(--font-wide); font-size: 1.8rem; color: var(--light-aqua); margin-bottom: 10px; text-transform: uppercase; }
        .service-desc { font-family: var(--font-body); font-size: 2.2rem; color: var(--off-white); font-weight: 300; }
    </style>
</head>
<body>
    <div class="preview-scale">
        <div class="poster">
            <img src="https://i.postimg.cc/vm6bwXqR/IMG-9698.png" class="logo">
            <div class="eyebrow">How we help</div>
            <h1 class="heading-adriana">Reclaiming your <br>digital peace.</h1>
            <div class="service-list">
                <div class="service-item">
                    <div class="service-title">Getting you back in</div>
                    <div class="service-desc">Reclaiming your accounts and identity.</div>
                </div>
                <div class="service-item">
                    <div class="service-title">Cleaning the noise</div>
                    <div class="service-desc">Identifying and reducing hidden risks.</div>
                </div>
                <div class="service-item">
                    <div class="service-title">Defending your privacy</div>
                    <div class="service-desc">Restoring your digital boundaries.</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
