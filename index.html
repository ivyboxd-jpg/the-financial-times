<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sybix - Slide 2 (Visual Fix)</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Syncopate:wght@700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --dark-navy: #0b1325; --bright-cyan: #38a4b8; --light-aqua: #66e3e7; 
            --white: #ffffff; --light-grey: #e2e8f0; 
            --font-wide: 'Syncopate', sans-serif; --font-adriana: 'Playfair Display', serif; --font-body: 'Lato', sans-serif; 
        }
        * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        body { background-color: #050a12; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .preview-scale { transform: scale(0.6); transform-origin: center; }
        
        /* MATCHES SLIDE 1 BG - Solid with one subtle glow */
        .poster {
            width: 1080px; height: 1350px; background-color: var(--dark-navy);
            padding: 80px 90px; display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        /* Subtle Tech Grid Visual (Matches Slide 1) */
        .poster::before {
            content: ""; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(56, 164, 184, 0.08) 1px, transparent 1px);
            background-size: 50px 50px; z-index: 0;
        }

        /* One soft glow only to prevent banding */
        .glow-overlay { 
            position: absolute; top: -10%; right: -10%; width: 700px; height: 700px; 
            background: radial-gradient(circle, rgba(26, 94, 120, 0.2) 0%, transparent 70%); 
            z-index: 1; 
        }

        .content { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }
        
        .logo { width: 410px; align-self: center; margin-bottom: 50px; }
        
        .eyebrow { 
            font-family: var(--font-wide); font-size: 1.4rem; color: var(--light-aqua); 
            letter-spacing: 6px; margin-bottom: 25px; text-transform: uppercase; 
        }
        
        .heading-adriana { 
            font-family: var(--font-adriana); font-size: 5rem; line-height: 1.1; 
            color: var(--white); margin: 0 0 55px 0; font-weight: 500; 
        }
        
        /* VISUAL CARDS - 3 POINTS */
        .service-list { display: flex; flex-direction: column; gap: 25px; }

        .service-card {
            background: rgba(255, 255, 255, 0.04);
            border-left: 6px solid var(--bright-cyan);
            padding: 35px 40px;
            border-radius: 0 15px 15px 0;
            backdrop-filter: blur(5px);
        }

        .service-title {
            font-family: var(--font-wide);
            font-size: 1.6rem;
            color: var(--light-aqua);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .service-desc {
            font-family: var(--font-body);
            font-size: 2.1rem;
            color: var(--light-grey); /* Lightened for reflection */
            font-weight: 300;
            line-height: 1.4;
        }

    </style>
</head>
<body>
    <div class="preview-scale">
        <div class="poster">
            <div class="glow-overlay"></div>
            <div class="content">
