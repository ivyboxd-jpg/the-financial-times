<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sybix - Slide 2 (Safe Layout)</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Syncopate:wght@700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --dark-navy: #0b1325; --bright-cyan: #38a4b8; --light-aqua: #66e3e7; 
            --white: #ffffff; --light-grey: #e2e8f0; 
            --font-wide: 'Syncopate', sans-serif; --font-adriana: 'Playfair Display', serif; --font-body: 'Lato', sans-serif; 
        }
        * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        body { background-color: #050a12; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .preview-scale { transform: scale(0.6); transform-origin: center; }
        
        .poster {
            width: 1080px; height: 1350px; background-color: var(--dark-navy);
            padding: 60px 90px; display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        /* Tech Grid */
        .poster::before {
            content: ""; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(56, 164, 184, 0.08) 1px, transparent 1px);
            background-size: 50px 50px; z-index: 0;
        }
        .glow { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); width: 900px; height: 600px; background: radial-gradient(ellipse, rgba(26, 94, 120, 0.3) 0%, transparent 70%); z-index: 1; }

        .content { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }
        .logo { width: 410px; align-self: center; margin-bottom: 40px; }
        .eyebrow { font-family: var(--font-wide); font-size: 1.4rem; color: var(--light-aqua); letter-spacing: 6px; margin-bottom: 25px; text-transform: uppercase; }
        .heading-adriana { font-family: var(--font-adriana); font-size: 4.8rem; line-height: 1.1; color: var(--white); margin: 0 0 45px 0; font-weight: 500; }
        
        .service-list { display: flex; flex-direction: column; gap: 25px; }
        .service-item { border-left: 6px solid var(--bright-cyan); padding-left: 30px; }
        .service-title { font-family: var(--font-wide); font-size: 1.6rem; color: var(--light-aqua); margin-bottom: 8px; text-transform: uppercase; }
        .service-desc { font-family: var(--font-body); font-size: 2rem; color: var(--light-grey); font-weight: 300; line-height: 1.4; }

        .footer-action { 
            margin-top: auto; font-family: var(--font-wide); font-size: 1.7rem; 
            color: var(--bright-cyan); letter-spacing: 3px; text-transform: uppercase; 
            display: flex; align-items: center; justify-content: space-between; 
            border-top: 2px solid rgba(255,255,255,0.1); padding-top: 35px; padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="preview-scale">
        <div class="poster">
            <div class="glow"></div>
            <div class="content">
                <img src="https://i.postimg.cc/vm6bwXqR/IMG-9698.png" class="logo">
                <div class="eyebrow">How we help</div>
                <h1 class="heading-adriana">Reclaiming your <br>digital peace.</h1>
                <div class="service-list">
                    <div class="service-item">
                        <div class="service-title">Getting you back in</div>
                        <div class="service-desc">Reclaiming your accounts and identity.</div>
                    </div>
                    <div class="service-item">
                        <div class="service-title">Cleaning the noise</div>
                        <div class="service-desc">Identifying and helping reduce hidden risks.</div>
                    </div>
                    <div class="service-item">
                        <div class="service-title">Defending your privacy</div>
                        <div class="service-desc">If your privacy has been affected, we restore your digital boundaries.</div>
                    </div>
                </div>
                <div class="footer-action">
                    <span>Swipe for our process</span>
                    <span>&rarr;</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
